<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BenjaDigital | Administração</title><link rel="stylesheet" href="premium.css"><style>body{background:#f6f8fc}.panel{max-width:900px;margin:45px auto;padding:24px;background:white;border-radius:18px}label{display:block;margin:10px 0 5px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="wrap nav-inner"><a class="brand" href="./">Benja<span>Digital</span><em>.RJ</em></a><span>Administração</span></div></header><main class="panel"><h1>Painel de produtos</h1><p class="muted">Acesso restrito a usuários autorizados. Produtos novos ficam ocultos até ativação.</p><p id="status" role="status"></p><section id="login"><form id="login-form"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button class="btn">Entrar</button></form></section><section id="workspace" class="hidden"><button id="logout" class="btn secondary" style="color:#15223d;border-color:#b8c4d8">Sair</button><h2>Cadastrar produto</h2><form id="product-form"><div class="row"><div><label>Nome</label><input name="name" required maxlength="150"></div><div><label>Categoria</label><select name="category"><option>Artes gráficas</option><option>Campanhas de saúde</option><option>Impressos</option><option>Sistemas</option><option>Vetores</option></select></div></div><label>Descrição</label><textarea name="description" rows="3"></textarea><div class="row"><div><label>Preço (R$)</label><input name="price" type="number" min="0" step="0.01" required></div><div><label>URL da imagem pública (https)</label><input name="image_url" type="url"></div></div><label><input name="active" type="checkbox" style="width:auto"> Exibir produto no catálogo</label><p class="muted">Arquivos pagos não devem ser disponibilizados por URLs públicas. A entrega protegida será implementada com o checkout.</p><button class="btn">Salvar produto</button></form><h2>Produtos cadastrados</h2><div id="products"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
